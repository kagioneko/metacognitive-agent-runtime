[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metacognitive-agent-runtime"
version = "0.1.0"
description = "A minimal runtime loop for external metacognition in AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Metacognitive Agent Runtime Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
openai = ["openai>=1.0"]

[project.scripts]
metacog = "metacog_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
